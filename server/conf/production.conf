# Production-specific configuration
# This file contains all production-specific settings and will override values in application.conf
# It should NOT be committed to version control and is included in .gitignore

include "application.conf"

# Production-specific overrides

# Security settings for production
play.http.secret.key = ${PLAY_APPLICATION_SECRET}
silhouette.authenticator.secureCookie = true
silhouette.authenticator.signer.key = ${SILHOUETTE_SIGNER_KEY}
silhouette.authenticator.crypter.key = ${SILHOUETTE_CRYPTER_KEY}
silhouette.csrfStateItemHandler.secureCookie = true
silhouette.csrfStateItemHandler.sameSite = "Lax"
silhouette.csrfStateItemHandler.cookieName = "OAuth2State-Lax"

# Trust X-Forwarded-* headers from reverse proxy (nginx/Dokku)
# This is required for Play to know the request is HTTPS when behind a proxy
play.filters.https.xForwardedProtoEnabled = true
play.http.forwarded.trustedProxies = ["0.0.0.0/0", "::/0"]

# Google settings for production
silhouette.google.redirectURL = ${YOUTUBE_REDIRECT_URL}
silhouette.google.clientID = ${YOUTUBE_CLIENT_ID}
silhouette.google.clientSecret = ${YOUTUBE_CLIENT_SECRET}
# Youtube chat
youtube.api.key = ${YOUTUBE_API_KEY}

# Discord settings for production
# The production Discord app must have https://evolutioncomplete.com/authenticate/discord
# registered as a redirect URI. If DISCORD_REDIRECT_URL is not set, the relative default
# /authenticate/discord is resolved against the request host at runtime (requires the
# X-Forwarded-Proto trust configured above) and produces the same URL.
silhouette.discord.redirectURL = ${?DISCORD_REDIRECT_URL}
silhouette.discord.clientID = ${?DISCORD_CLIENT_ID}
silhouette.discord.clientSecret = ${?DISCORD_CLIENT_SECRET}

# File Storage Configuration for production (Dokku mount)
app.storage.uploads.path = "/app/uploads"

# File Logs Configuration for production (Dokku mount)
app.storage.logs.path = "/app/logs"

# Replay Parser service URL for production (Dokku app)
replayparser.url = ${REPLAY_PARSER_URL}

# Database configuration for production
# Rather than setting these directly, we'll use the custom DokkuApplicationLoader
# to parse DATABASE_URL and set the correct properties dynamically
slick.dbs.default.db.dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"
slick.dbs.default.profile = "slick.jdbc.PostgresProfile$"
slick.dbs.default.driver = "org.postgresql.Driver"
slick.dbs.default.db.properties.driver = "org.postgresql.Driver"
# Allowed hosts for production
play.filters.hosts.allowed = [".evolutioncomplete.com", "evolutioncomplete.com"]

# Logging settings for production
pekko.loglevel = "INFO"

# Use custom application loader to parse DATABASE_URL
play.application.loader = "modules.DokkuApplicationLoader"

# Challonge API settings - replace with your actual API key
challonge.api.key = ${CHALLONGE_API_KEY}
